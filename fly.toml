# NOTE: This service has been migrated to GCP Cloud Run (v1.4, 2026-05-06).
# This fly.toml is kept for reference only. The active deployment is now
# managed by .github/workflows/deploy-cloud-run.yml.
#
app = "event-stream-service"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8085"

[[services]]
  internal_port = 8085
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"
